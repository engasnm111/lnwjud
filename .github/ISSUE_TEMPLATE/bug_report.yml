name: Bug report
description: Report a reproducible lnwjud problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not post credentials, private logs, or vulnerability details here. Security-sensitive reports must follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: lnwjud version
      description: "Example: v4.10.0"
      placeholder: v4.x.x
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the operating system where the problem occurs.
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS / distribution version
      description: Include the OS release, Linux distribution, or equivalent platform version.
      placeholder: Windows 11 24H2 / macOS 15.6 / Ubuntu 24.04 LTS
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: CPU architecture
      options:
        - x64 / amd64
        - arm64 / Apple Silicon
        - Other
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop UI
        - MCP / Secure MCP Tunnel
        - Files / workspace
        - Git
        - Processes / shell
        - WSL / platform integration
        - Browser / desktop automation
        - Logs / observability
        - Installer / updater
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, credentials, private paths/data, and unrelated personal information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain secrets, credentials, or private vulnerability details.
          required: true
