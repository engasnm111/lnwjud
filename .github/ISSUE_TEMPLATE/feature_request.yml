name: Feature request
description: Propose an improvement to lnwjud
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first, then the proposed solution. Large architectural changes may need design discussion before implementation.
  - type: dropdown
    id: platforms
    attributes:
      label: Target platform(s)
      description: Select every platform this request should support.
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - All platforms
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or alternative designs.
  - type: textarea
    id: safety
    attributes:
      label: Security / compatibility considerations
      description: Note any effect on workspace boundaries, permissions, destructive actions, MCP compatibility, storage, or cross-platform support (Windows, macOS, Linux).
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests for similar requests.
          required: true
        - label: This request does not include credentials, private logs, or vulnerability details.
          required: true
