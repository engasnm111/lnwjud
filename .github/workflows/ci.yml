name: CI

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Authoritative Release Verification (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install ripgrep for E2E search
        shell: powershell
        run: choco install ripgrep -y --no-progress

      - name: Run authoritative verification gate
        shell: powershell
        env:
          # electron-builder uses these only when the real production certificate secrets exist.
          # Pull requests/forks remain buildable unsigned; public Release has a separate mandatory signature gate.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-release.ps1

      - name: Upload verified Windows release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: |
            apps/desktop/dist/installers/*.exe
            apps/desktop/dist/installers/*.blockmap
            apps/desktop/dist/installers/latest.yml
            apps/desktop/dist/installers/portable.yml
            apps/desktop/dist/installers/SHA256SUMS.txt
            apps/desktop/dist/installers/PROVENANCE.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
