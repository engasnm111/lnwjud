name: CI

on:
  push:
    branches:
      - main
      - dev
      - macos-linux
      - 'release/v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Keep this check name stable because main branch protection requires it.
    name: Authoritative Release Verification (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install ripgrep for E2E search
        shell: powershell
        run: |
          if (Get-Command rg -ErrorAction SilentlyContinue) {
            rg --version
          }
          else {
            choco install ripgrep -y --no-progress
          }

      - name: Run pull-request verification gate
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-release.ps1 -SkipWindowsPackaging

      - name: Run authoritative release verification gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          # electron-builder signs only when both real production certificate secrets exist.
          # Unsigned community releases remain supported; Release verifies provenance/hashes and reports signing state.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-release.ps1

      - name: Upload verified Windows release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: |
            apps/desktop/dist/installers/*.exe
            apps/desktop/dist/installers/*.blockmap
            apps/desktop/dist/installers/latest.yml
            apps/desktop/dist/installers/portable.yml
            apps/desktop/dist/installers/SHA256SUMS.txt
            apps/desktop/dist/installers/PROVENANCE.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  cross-platform-core:
    name: Cross-platform core (${{ matrix.os }})
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/macos-linux' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify platform/runtime packages
        run: |
          pnpm --filter @lnwjud/platform test
          pnpm --filter @lnwjud/process test
          pnpm --filter @lnwjud/shared test
          pnpm --filter @lnwjud/workspace test
          pnpm --filter @lnwjud/capabilities test
          pnpm --filter @lnwjud/desktop typecheck

      - name: Package native desktop artifact
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/macos-linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            pnpm --filter @lnwjud/desktop package:macos
          else
            pnpm --filter @lnwjud/desktop package:linux
          fi

      - name: Upload cross-platform dev artifacts
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-dev-${{ github.sha }}
          path: apps/desktop/dist/installers/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload cross-platform macos-linux artifacts
        if: github.ref == 'refs/heads/macos-linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-macos-linux-${{ github.sha }}
          path: apps/desktop/dist/installers/*
          if-no-files-found: error
          retention-days: 7
