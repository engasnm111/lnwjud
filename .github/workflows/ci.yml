name: CI

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Keep this check name stable because main branch protection requires it.
    name: Authoritative Release Verification (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install ripgrep for E2E search
        shell: powershell
        run: |
          if (Get-Command rg -ErrorAction SilentlyContinue) {
            rg --version
          }
          else {
            choco install ripgrep -y --no-progress
          }

      - name: Run pull-request verification gate
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-release.ps1 -SkipWindowsPackaging

      - name: Run authoritative release verification gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          # Signing secrets are exposed only on main pushes. Same-repo pull_request
          # builds execute the PR head's own code, so they must never see the
          # certificate; they verify unsigned exactly like fork PRs, and the public
          # Release pipeline re-runs the mandatory signature gate.
          CSC_LINK: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.WINDOWS_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.WINDOWS_CSC_KEY_PASSWORD) || '' }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-release.ps1

      - name: Upload verified Windows release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: |
            apps/desktop/dist/installers/*.exe
            apps/desktop/dist/installers/*.blockmap
            apps/desktop/dist/installers/latest.yml
            apps/desktop/dist/installers/portable.yml
            apps/desktop/dist/installers/SHA256SUMS.txt
            apps/desktop/dist/installers/PROVENANCE.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  verify-macos:
    name: macOS Verification
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: corepack pnpm@10.15.0 install --frozen-lockfile

      - name: Run macOS verification gate
        run: |
          corepack pnpm@10.15.0 typecheck
          corepack pnpm@10.15.0 lint
          corepack pnpm@10.15.0 test:release
          corepack pnpm@10.15.0 test:integration
