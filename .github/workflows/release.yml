name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish Verified Cross-Platform Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify release tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
            echo "Release tag must match package.json version. Expected $expected_tag but got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Download verified target-native CI artifacts for the exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY}"
          sha="${GITHUB_SHA}"
          staging_directory="$PWD/release-staging"
          mkdir -p "$staging_directory"

          run_id="$(gh run list \
            --repo "$repository" \
            --workflow ci.yml \
            --commit "$sha" \
            --branch main \
            --event push \
            --status success \
            --limit 20 \
            --json databaseId,headSha,conclusion \
            --jq ".[] | select(.headSha == \"$sha\" and .conclusion == \"success\") | .databaseId" | sed -n '1p')"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh run list \
              --repo "$repository" \
              --workflow ci.yml \
              --commit "$sha" \
              --branch main \
              --event workflow_dispatch \
              --status success \
              --limit 20 \
              --json databaseId,headSha,conclusion \
              --jq ".[] | select(.headSha == \"$sha\" and .conclusion == \"success\") | .databaseId" | sed -n '1p')"
          fi
          if [[ -z "$run_id" ]]; then
            echo "Release requires a successful CI push or workflow_dispatch run for exact commit $sha before tagging." >&2
            exit 1
          fi

          declare -a targets=(
            "win32-x64|windows-release-$sha"
            "darwin-arm64|native-darwin-arm64-$sha"
            "darwin-x64|native-darwin-x64-$sha"
            "linux-x64|native-linux-x64-$sha"
            "linux-arm64|native-linux-arm64-$sha"
          )
          for target in "${targets[@]}"; do
            key="${target%%|*}"
            artifact_name="${target#*|}"
            mkdir -p "$staging_directory/$key"
            gh run download "$run_id" --repo "$repository" --name "$artifact_name" --dir "$staging_directory/$key"
          done
          echo "Using successful CI run $run_id for exact commit $sha"

      - name: Prepare source-bound Windows bridge verification metadata
        # Recreate only deterministic verification inputs, never rebuild packages.
        run: node apps/desktop/scripts/write-capability-integrity.mjs

      - name: Verify each downloaded release evidence bundle
        shell: bash
        env:
          LNWJUD_RELEASE_ARTIFACT_ONLY: '1'
        run: |
          set -euo pipefail
          staging_directory="$PWD/release-staging"
          sha="${GITHUB_SHA}"

          declare -a targets=(
            "win32-x64|win32|x64"
            "darwin-arm64|darwin|arm64"
            "darwin-x64|darwin|x64"
            "linux-x64|linux|x64"
            "linux-arm64|linux|arm64"
          )
          for target in "${targets[@]}"; do
            IFS='|' read -r key platform arch <<< "$target"
            mapfile -t provenance_files < <(find "$staging_directory/$key" -type f -name PROVENANCE.json -print)
            if [[ "${#provenance_files[@]}" -ne 1 ]]; then
              echo "Expected one PROVENANCE.json for $key, found ${#provenance_files[@]}" >&2
              exit 1
            fi
            installer_directory="$(dirname "${provenance_files[0]}")"
            LNWJUD_RELEASE_INSTALLER_DIRECTORY="$installer_directory" \
            LNWJUD_RELEASE_PLATFORM="$platform" \
            LNWJUD_RELEASE_ARCH="$arch" \
            LNWJUD_EXPECTED_COMMIT_SHA="$sha" \
            LNWJUD_REQUIRE_CLEAN_PROVENANCE='1' \
              node apps/desktop/scripts/verify-release-evidence.mjs
          done

      - name: Aggregate target-native artifacts and update feeds
        shell: bash
        env:
          LNWJUD_RELEASE_STAGING_DIRECTORY: ${{ github.workspace }}/release-staging
          LNWJUD_RELEASE_ASSETS_DIRECTORY: ${{ github.workspace }}/release-assets
          LNWJUD_RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/collect-release-assets.mjs

      - name: Publish verified cross-platform release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Published from the exact successful CI commit `${{ github.sha }}`.

            The release contains target-native Windows, macOS (arm64/x64), and Linux (x64/arm64) artifacts. `RELEASE_MANIFEST.json`, per-target provenance, and aggregate SHA-256 evidence describe the artifact set. No package or build step runs in this tag workflow.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
