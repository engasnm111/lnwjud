name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish Verified Cross-Platform Release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify release tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
            echo "Release tag must match package.json version. Expected $expected_tag but got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Generate and validate user-facing release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs \
            --tag "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --output release-notes.md

      - name: Download verified target-native CI artifacts for the exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY}"
          sha="${GITHUB_SHA}"
          staging_directory="$PWD/release-staging"
          mkdir -p "$staging_directory"

          find_ci_run() {
            local event="$1"
            gh run list \
              --repo "$repository" \
              --workflow ci.yml \
              --commit "$sha" \
              --branch main \
              --event "$event" \
              --limit 20 \
              --json databaseId,attempt,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$sha\") | [.databaseId, .attempt, .status, (.conclusion // \"\")] | @tsv" | sed -n '1p'
          }

          # Tag pushes can race protected main CI. Wait for that exact-SHA run
          # instead of creating a false-red Release before CI has finished.
          run_id=""
          run_attempt=""
          ci_wait_deadline=$((SECONDS + 3600))
          while [[ -z "$run_id" ]]; do
            candidate="$(find_ci_run push)"
            if [[ -z "$candidate" ]]; then
              candidate="$(find_ci_run workflow_dispatch)"
            fi

            if [[ -n "$candidate" ]]; then
              IFS=$'\t' read -r candidate_id candidate_attempt candidate_status candidate_conclusion <<< "$candidate"
              if [[ "$candidate_status" == "completed" ]]; then
                if [[ "$candidate_conclusion" == "success" ]]; then
                  if [[ ! "$candidate_attempt" =~ ^[1-9][0-9]*$ ]]; then
                    echo "Exact-commit CI run $candidate_id has an invalid attempt number." >&2
                    exit 1
                  fi
                  run_id="$candidate_id"
                  run_attempt="$candidate_attempt"
                  break
                fi
                echo "Exact-commit CI run $candidate_id completed with conclusion '$candidate_conclusion'; refusing release." >&2
                exit 1
              fi
              echo "Waiting for exact-commit CI run $candidate_id attempt $candidate_attempt ($candidate_status) for $sha..."
            else
              echo "Waiting for main CI to appear for exact commit $sha..."
            fi

            if (( SECONDS >= ci_wait_deadline )); then
              echo "Timed out waiting 60 minutes for successful main CI on exact commit $sha." >&2
              exit 1
            fi
            sleep 20
          done

          declare -a targets=(
            "win32-x64|windows-release-$sha"
            "darwin-arm64|native-darwin-arm64-$sha"
            "darwin-x64|native-darwin-x64-$sha"
            "linux-x64|native-linux-x64-$sha"
            "linux-arm64|native-linux-arm64-$sha"
          )
          for target in "${targets[@]}"; do
            key="${target%%|*}"
            artifact_name="${target#*|}"
            mkdir -p "$staging_directory/$key"
            gh run download "$run_id" --repo "$repository" --name "$artifact_name" --dir "$staging_directory/$key"
          done

          updater_receipt_targets=(
            "win32-x64|signed-update-e2e-win32-x64-$sha-run-$run_id-attempt-$run_attempt"
            "darwin-arm64|signed-update-e2e-darwin-arm64-$sha-run-$run_id-attempt-$run_attempt"
            "darwin-x64|signed-update-e2e-darwin-x64-$sha-run-$run_id-attempt-$run_attempt"
          )
          for target in "${updater_receipt_targets[@]}"; do
            key="${target%%|*}"
            artifact_name="${target#*|}"
            receipt_directory="$staging_directory/$key/updater-acceptance"
            mkdir -p "$receipt_directory"
            gh run download "$run_id" --repo "$repository" --name "$artifact_name" --dir "$receipt_directory"
          done
          {
            printf 'LNWJUD_RELEASE_CI_RUN_ID=%s\n' "$run_id"
            printf 'LNWJUD_RELEASE_CI_RUN_ATTEMPT=%s\n' "$run_attempt"
          } >> "$GITHUB_ENV"
          echo "Using successful CI run $run_id attempt $run_attempt for exact commit $sha"

      - name: Prepare source-bound Windows bridge verification metadata
        # Recreate only deterministic verification inputs, never rebuild packages.
        run: node apps/desktop/scripts/write-capability-integrity.mjs

      - name: Verify each downloaded release evidence bundle
        shell: bash
        env:
          LNWJUD_RELEASE_ARTIFACT_ONLY: '1'
        run: |
          set -euo pipefail
          staging_directory="$PWD/release-staging"
          sha="${GITHUB_SHA}"

          declare -a targets=(
            "win32-x64|win32|x64"
            "darwin-arm64|darwin|arm64"
            "darwin-x64|darwin|x64"
            "linux-x64|linux|x64"
            "linux-arm64|linux|arm64"
          )
          for target in "${targets[@]}"; do
            IFS='|' read -r key platform arch <<< "$target"
            mapfile -t provenance_files < <(find "$staging_directory/$key" -type f -name PROVENANCE.json -print)
            if [[ "${#provenance_files[@]}" -ne 1 ]]; then
              echo "Expected one PROVENANCE.json for $key, found ${#provenance_files[@]}" >&2
              exit 1
            fi
            installer_directory="$(dirname "${provenance_files[0]}")"
            acceptance_file=''
            require_update_acceptance='0'
            if [[ "$platform" == win32 || "$platform" == darwin ]]; then
              acceptance_directory="$staging_directory/$key/updater-acceptance"
              mapfile -t acceptance_files < <(find "$acceptance_directory" -type f -name update-acceptance.json -print)
              if [[ "${#acceptance_files[@]}" -ne 1 ]]; then
                echo "Expected one update-acceptance.json for $key from CI run $LNWJUD_RELEASE_CI_RUN_ID attempt $LNWJUD_RELEASE_CI_RUN_ATTEMPT, found ${#acceptance_files[@]}" >&2
                exit 1
              fi
              acceptance_file="${acceptance_files[0]}"
              require_update_acceptance='1'
            fi
            LNWJUD_RELEASE_INSTALLER_DIRECTORY="$installer_directory" \
            LNWJUD_RELEASE_PLATFORM="$platform" \
            LNWJUD_RELEASE_ARCH="$arch" \
            LNWJUD_EXPECTED_COMMIT_SHA="$sha" \
            LNWJUD_REQUIRE_CLEAN_PROVENANCE='1' \
            LNWJUD_REQUIRE_UPDATE_ACCEPTANCE="$require_update_acceptance" \
            LNWJUD_UPDATE_ACCEPTANCE_FILE="$acceptance_file" \
            LNWJUD_UPDATE_ACCEPTANCE_RUN_ID="$LNWJUD_RELEASE_CI_RUN_ID" \
            LNWJUD_UPDATE_ACCEPTANCE_RUN_ATTEMPT="$LNWJUD_RELEASE_CI_RUN_ATTEMPT" \
              node apps/desktop/scripts/verify-release-evidence.mjs
          done

      - name: Aggregate target-native artifacts and update feeds
        shell: bash
        env:
          LNWJUD_RELEASE_STAGING_DIRECTORY: ${{ github.workspace }}/release-staging
          LNWJUD_RELEASE_ASSETS_DIRECTORY: ${{ github.workspace }}/release-assets
          LNWJUD_RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/collect-release-assets.mjs

      - name: Publish verified cross-platform release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
