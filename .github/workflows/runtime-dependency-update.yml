name: Runtime Dependency Update

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runtime-dependency-managed
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'pull_request'
    name: Check verified runtime releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm 10.15.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
          run_install: false

      - name: Update verified runtime dependency manifest
        run: node scripts/update-runtime-dependencies.mjs --write

      - name: Stop when pins are already current
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/src/main/runtime-dependencies.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff -- apps/desktop/src/main/runtime-dependencies.json
          fi

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify dependency contract before opening PR
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          node apps/desktop/scripts/write-stdio-launcher.mjs
          pnpm --filter @lnwjud/desktop typecheck
          pnpm --filter @lnwjud/desktop build
          pnpm test:packaging

      - name: Upsert the one verified managed dependency PR
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/apply-runtime-dependency-pr.mjs --apply

  cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    name: Conditionally delete only the merged managed runtime ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted dev code
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Revalidate merged PR identity and delete exact SHA only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/cleanup-runtime-dependency-branch.mjs --apply
