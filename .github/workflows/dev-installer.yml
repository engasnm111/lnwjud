name: Dev Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Capture clean source checkout provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkoutSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkoutSha -ne $env:GITHUB_SHA) {
            throw 'DEV_INSTALLER_SOURCE_SHA_MISMATCH'
          }
          $sourceStatus = @(git status --porcelain=v1 --untracked-files=normal)
          if ($LASTEXITCODE -ne 0 -or (($sourceStatus -join "`n").Trim().Length -gt 0)) {
            throw 'DEV_INSTALLER_SOURCE_CHECKOUT_DIRTY'
          }
          Add-Content -Path $env:GITHUB_ENV -Value 'LNWJUD_SOURCE_DIRTY_AT_START=0'

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup .NET 8 containment compiler
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '8.0.x'

      - name: Install cosign for tunnel provenance verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Setup pnpm 10.15.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
          run_install: false

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Prepare trusted containment runtime
        run: pnpm prepare:containment

      - name: Verify scheduled continuation contract
        shell: pwsh
        run: |
          pnpm --filter @lnwjud/mcp-server exec vitest run src/scheduled-continuation-skill-contract.test.ts src/tools/goal-tools.test.ts src/tools/scheduled-continuation-tools.test.ts
          pnpm --filter @lnwjud/application exec vitest run src/scheduled-continuation-service.test.ts
          pnpm --filter @lnwjud/storage exec vitest run src/scheduled-continuation.integration.test.ts

      - name: Build workspace dependencies
        shell: pwsh
        run: pnpm build

      - name: Build Windows Setup and Portable
        shell: pwsh
        env:
          LNWJUD_COSIGN_PATH: cosign
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/package-windows.ps1

      - name: Verify silent current-user setup refuses without extracting application files
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'apps/desktop/dist/installers' -Filter 'lnwjud-Setup-*.exe' -File)
          if ($installers.Count -ne 1) { throw 'EXPECTED_ONE_NSIS_INSTALLER' }
          $target = Join-Path $env:RUNNER_TEMP 'lnwjud-currentuser-refusal'
          if (Test-Path -LiteralPath $target) { throw 'INSTALL_TEST_TARGET_ALREADY_EXISTS' }
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\com.lnwjud.desktop'
          $hadUninstallKey = Test-Path -LiteralPath $uninstallKey
          $hadService = $null -ne (Get-Service -Name 'LnwjudContainment' -ErrorAction SilentlyContinue)
          if ($hadUninstallKey -or $hadService) { throw 'INSTALL_TEST_RUNNER_NOT_CLEAN' }
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', '/currentuser', "/D=$target") -PassThru -WindowStyle Hidden
          if (-not $installer.WaitForExit(90000)) {
            $installer.Kill()
            throw 'SILENT_CURRENTUSER_INSTALLER_TIMEOUT'
          }
          if ($installer.ExitCode -ne 125) { throw "SILENT_CURRENTUSER_EXPECTED_REFUSAL_125_ACTUAL_$($installer.ExitCode)" }
          if ((Test-Path -LiteralPath $target) -and @(Get-ChildItem -LiteralPath $target -Force).Count -ne 0) {
            throw 'SILENT_CURRENTUSER_EXTRACTED_FILES'
          }
          if ((Test-Path -LiteralPath $uninstallKey) -or
              $null -ne (Get-Service -Name 'LnwjudContainment' -ErrorAction SilentlyContinue)) {
            throw 'SILENT_CURRENTUSER_CREATED_INSTALL_REGISTRATION'
          }
          Write-Output 'SILENT_CURRENTUSER_CLEAN_REFUSAL_VERIFIED'

      - name: Verify protected all-users silent install and uninstall on hosted Windows
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'apps/desktop/dist/installers' -Filter 'lnwjud-Setup-*.exe' -File)
          if ($installers.Count -ne 1) { throw 'EXPECTED_ONE_NSIS_INSTALLER' }
          $target = Join-Path $env:ProgramFiles 'lnwjud'
          if ((Test-Path -LiteralPath $target) -or
              $null -ne (Get-Service -Name 'LnwjudContainment' -ErrorAction SilentlyContinue)) {
            throw 'ALLUSERS_INSTALL_TEST_RUNNER_NOT_CLEAN'
          }
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', '/allusers') -PassThru -WindowStyle Hidden
          if (-not $installer.WaitForExit(120000)) {
            $installer.Kill()
            throw 'ALLUSERS_SILENT_INSTALL_TIMEOUT'
          }
          if ($installer.ExitCode -ne 0) { throw "ALLUSERS_SILENT_INSTALL_EXIT_$($installer.ExitCode)" }
          $application = Join-Path $target 'lnwjud.exe'
          $uninstaller = Join-Path $target 'uninstall.exe'
          $helper = Join-Path $target 'resources/native-containment/lnwjud-containment.exe'
          foreach ($file in @($application, $uninstaller, $helper)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "ALLUSERS_INSTALLED_FILE_MISSING_$file" }
          }
          $service = Get-Service -Name 'LnwjudContainment' -ErrorAction SilentlyContinue
          try {
            if ($null -eq $service -or $service.Status -ne 'Running') {
              throw 'ALLUSERS_PROTECTED_SERVICE_NOT_RUNNING'
            }
          } finally {
            # ServiceController may retain a native SCM handle even after Status.
            # Holding it across DeleteService prevents the entry from disappearing.
            if ($null -ne $service) { $service.Dispose() }
          }
          $serviceConfig = Get-CimInstance Win32_Service -Filter "Name='LnwjudContainment'"
          if ($null -eq $serviceConfig -or $serviceConfig.StartName -ne 'LocalSystem' -or
              $serviceConfig.PathName -notlike "*lnwjud-containment.exe*") {
            throw 'ALLUSERS_PROTECTED_SERVICE_IDENTITY_INVALID'
          }
          $remover = Start-Process -FilePath $uninstaller -ArgumentList @('/S', '/allusers') -PassThru -WindowStyle Hidden
          if (-not $remover.WaitForExit(120000)) {
            $remover.Kill()
            throw 'ALLUSERS_SILENT_UNINSTALL_TIMEOUT'
          }
          if ($remover.ExitCode -ne 0) { throw "ALLUSERS_SILENT_UNINSTALL_EXIT_$($remover.ExitCode)" }
          # NSIS may spawn its actual uninstaller as a second process and let
          # the initial bootstrap exit 0 first. Verify final state, not only
          # the bootstrap exit; a broken teardown must still fail after a bound.
          $verification = [Diagnostics.Stopwatch]::StartNew()
          while ($true) {
            $applicationRemains = Test-Path -LiteralPath $application -PathType Leaf
            $helperRemains = Test-Path -LiteralPath $helper -PathType Leaf
            $remainingService = Get-Service -Name 'LnwjudContainment' -ErrorAction SilentlyContinue
            try {
              $serviceState = if ($null -eq $remainingService) { 'absent' } else { $remainingService.Status.ToString() }
            } finally {
              if ($null -ne $remainingService) { $remainingService.Dispose() }
            }
            if (-not $applicationRemains -and -not $helperRemains -and $serviceState -eq 'absent') { break }
            if ($verification.Elapsed -ge [TimeSpan]::FromSeconds(90)) {
              throw ("ALLUSERS_SILENT_UNINSTALL_INCOMPLETE application={0} helper={1} service={2}" -f
                $applicationRemains, $helperRemains, $serviceState)
            }
            Start-Sleep -Milliseconds 250
          }
          Write-Output 'ALLUSERS_SILENT_INSTALL_PROTECTED_SERVICE_UNINSTALL_VERIFIED'

      - name: Run packaged Windows Electron MCP and security smoke
        shell: pwsh
        timeout-minutes: 10
        env:
          LNWJUD_PACKAGED_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/installers/win-unpacked/lnwjud.exe
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm --filter @lnwjud/desktop exec playwright test --config playwright.config.ts desktop-dashboard.e2e.ts desktop-mcp-client.e2e.ts tools-doctor.e2e.ts electron-security.e2e.ts --trace=retain-on-failure --reporter=list,html

      - name: Upload Windows packaged E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-windows-e2e-${{ github.sha }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload dev installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dev-windows-installer-${{ github.sha }}
          path: |
            apps/desktop/dist/installers/*.exe
            apps/desktop/dist/installers/*.blockmap
            apps/desktop/dist/installers/latest.yml
            apps/desktop/dist/installers/portable.yml
            apps/desktop/dist/installers/SHA256SUMS.txt
            apps/desktop/dist/installers/PROVENANCE.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
