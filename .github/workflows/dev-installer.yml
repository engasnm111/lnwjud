name: Dev Windows Installer

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: dev-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-installer]')
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install cosign for tunnel provenance verification
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Enable Corepack & Setup pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        shell: pwsh
        run: corepack pnpm@10.15.0 install --frozen-lockfile

      - name: Verify scheduled continuation contract
        shell: pwsh
        run: |
          corepack pnpm@10.15.0 --filter @lnwjud/mcp-server exec vitest run src/scheduled-continuation-skill-contract.test.ts src/tools/goal-tools.test.ts src/tools/scheduled-continuation-tools.test.ts
          corepack pnpm@10.15.0 --filter @lnwjud/application exec vitest run src/scheduled-continuation-service.test.ts
          corepack pnpm@10.15.0 --filter @lnwjud/storage exec vitest run src/scheduled-continuation.integration.test.ts

      - name: Build workspace dependencies
        shell: pwsh
        run: corepack pnpm@10.15.0 build

      - name: Build Windows Setup and Portable
        shell: pwsh
        env:
          LNWJUD_COSIGN_PATH: cosign
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/package-windows.ps1

      - name: Run packaged Windows Electron MCP and security smoke
        shell: pwsh
        timeout-minutes: 10
        env:
          LNWJUD_PACKAGED_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/installers/win-unpacked/lnwjud.exe
          PLAYWRIGHT_HTML_OPEN: never
        run: corepack pnpm@10.15.0 --filter @lnwjud/desktop exec playwright test --config playwright.config.ts desktop-dashboard.e2e.ts desktop-mcp-client.e2e.ts tools-doctor.e2e.ts electron-security.e2e.ts --trace=retain-on-failure --reporter=list,html

      - name: Upload Windows packaged E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-windows-e2e-${{ github.sha }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload dev installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-windows-installer-${{ github.sha }}
          path: |
            apps/desktop/dist/installers/*.exe
            apps/desktop/dist/installers/*.blockmap
            apps/desktop/dist/installers/latest.yml
            apps/desktop/dist/installers/portable.yml
            apps/desktop/dist/installers/SHA256SUMS.txt
            apps/desktop/dist/installers/PROVENANCE.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
