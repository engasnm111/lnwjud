appId: com.lnwjud.desktop
productName: lnwjud
asar: true
directories:
  output: dist/installers
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json
extraResources:
  - from: ../../packages/capabilities/src/windows-capability-bridge.ps1
    to: windows-capability-bridge.ps1
  - from: build/lnwjud-mcp-stdio.cjs
    to: lnwjud-mcp-stdio.cjs
  - from: build/lnwjud-mcp-stdio.cmd
    to: lnwjud-mcp-stdio.cmd
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: lnwjud-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
