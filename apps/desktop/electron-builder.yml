appId: com.lnwjud.desktop
productName: lnwjud
asar: true
npmRebuild: false
directories:
  output: dist/installers
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
publish:
  provider: github
  owner: engasnm111
  repo: lnwjud
  releaseType: release
afterPack: scripts/capture-packaged-runtime-evidence.mjs
afterSign: scripts/capture-packaged-runtime-evidence.mjs
extraResources:
  - from: ../../packages/capabilities/src/windows-capability-bridge.ps1
    to: windows-capability-bridge.ps1
  - from: build/windows-capability-bridge.sha256
    to: windows-capability-bridge.sha256
  - from: ../../native/windows-ocr/bin
    to: windows-ocr
  - from: build/tunnel-client
    to: tunnel-client
  - from: build/runtime-tools
    to: runtime-tools
# Tunnel profile expects these next to lnwjud.exe / lnwjud (not only under resources/).
extraFiles:
  - from: build/lnwjud-mcp-stdio.cjs
    to: lnwjud-mcp-stdio.cjs
  - from: build/lnwjud-mcp-stdio.cmd
    to: lnwjud-mcp-stdio.cmd
  - from: build/lnwjud-mcp-stdio
    to: lnwjud-mcp-stdio
  - from: build/lnwjud-node.exe
    to: lnwjud-node.exe
  - from: build/lnwjud-node
    to: lnwjud-node
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: lnwjud-Setup-${version}.${ext}
  # Keep the branded icon embedded in lnwjud.exe for Windows shortcuts and taskbar.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Create the Start Menu link in installer.nsh from $INSTDIR so no build-user path can be baked in.
  createStartMenuShortcut: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: ${productName}
  include: build/installer.nsh
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: lnwjud-${version}-${arch}.${ext}
  darkModeSupport: true
dmg:
  artifactName: lnwjud-${version}-${arch}.dmg
portable:
  artifactName: lnwjud-Portable-${version}.${ext}
