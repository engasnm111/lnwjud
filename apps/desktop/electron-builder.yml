appId: com.lnwjud.desktop
productName: lnwjud
asar: true
npmRebuild: false
directories:
  output: dist/installers
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
publish:
  provider: github
  owner: engasnm111
  repo: lnwjud
  releaseType: release
afterPack: scripts/capture-packaged-runtime-evidence.mjs
afterSign: scripts/capture-packaged-runtime-evidence.mjs
# Shared resources are target-native: prepare:runtime-assets replaces runtime-tools
# with the current platform/architecture bundle before electron-builder runs.
extraResources:
  - from: build/runtime-tools
    to: runtime-tools
  - from: build/tunnel-client
    to: tunnel-client
  - from: ../../.agents/skills/lnwjud-scheduled-continuation
    to: agent-skills/lnwjud-scheduled-continuation
# The canonical stdio boundary lives beside the packaged app content root.
# write-stdio-launcher.mjs emits only the launcher/node filenames for the
# current OS, so stale opposite-platform files cannot leak into an artifact.
extraFiles:
  - from: build
    to: .
    filter:
      - lnwjud-mcp-stdio.cjs
      - lnwjud-mcp-stdio.cmd
      - lnwjud-mcp-stdio
      - lnwjud-node.exe
      - lnwjud-node
      - BUNDLED_NODE.txt
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: lnwjud-Setup-${version}.${ext}
  # Keep Windows-only native helpers out of macOS/Linux packages.
  extraResources:
    - from: build/capability-bridge/windows-capability-bridge.ps1
      to: windows-capability-bridge.ps1
    - from: build/capability-bridge/windows-capability-bridge.sha256
      to: windows-capability-bridge.sha256
    - from: build/capability-bridge/windows-capability-bridge.integrity.json
      to: windows-capability-bridge.integrity.json
    - from: ../../native/windows-ocr/bin
      to: windows-ocr

  # Keep the branded icon embedded in lnwjud.exe for Windows shortcuts and taskbar.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Create the Start Menu link in installer.nsh from $INSTDIR so no build-user path can be baked in.
  createStartMenuShortcut: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: ${productName}
  include: build/installer.nsh
portable:
  artifactName: lnwjud-Portable-${version}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: lnwjud-macOS-${arch}-${version}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: lnwjud-Linux-${arch}-${version}.${ext}
  executableName: lnwjud
